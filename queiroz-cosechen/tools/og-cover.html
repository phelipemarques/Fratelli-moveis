<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>OG</title>
<!-- Gera assets/images/og-cover.jpg (1200×630). Ver README, seção "Imagem de compartilhamento". -->
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1c1c1c; }
  .og { position: relative; box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .og h1 { font-size: 92px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 800; margin: 0; }
  .og .kicker { margin: 0; font-size: 18px; }
  .og__foot { display: flex; justify-content: space-between; align-items: flex-end; font-weight: 700; font-size: 24px; }
  .og__foot span:last-child { color: var(--violet-soft); }
  .og__line { position: absolute; right: 80px; top: 0; width: 3px; height: 300px; background: radial-gradient(circle, #2d0cd5 1.5px, transparent 2px) 50% 0 / 3px 10px repeat-y; }
</style></head>
<body><div class="og">
  <span class="og__line"></span>
  <p class="kicker">Advogado do servidor público e sindicatos</p>
  <h1>Direito do servidor público,<br>explicado <mark class="hl">sem rodeio.</mark></h1>
  <div class="og__foot"><span>Vitor Queiroz Cosechen</span><span>@vitorqcosechen.adv</span></div>
</div></body></html>
