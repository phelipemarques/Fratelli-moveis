<!doctype html>
<!-- Gera assets/images/og-cover.jpg (1200x630). Abrir pelo servidor local e capturar
     com: node tools/gerar-og.mjs  — provisório até chegarem a logo e as fotos originais. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 660px 1fr; align-items: center; padding: 0 64px; box-sizing: border-box; isolation: isolate; }
  .og::before { content: ""; position: absolute; inset: -10%; z-index: -2; background: url(../assets/images/foto-buffet-vitrine.webp) center/cover; filter: blur(46px) brightness(.4) saturate(1.3); }
  .og::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgb(11 10 8 / .95), rgb(11 10 8 / .5)); }
  .og h1 { font-family: var(--f-display); font-weight: 600; font-size: 74px; line-height: .98; text-transform: uppercase; margin: 18px 0 0; }
  .og h1 .script { display: inline-block; font-size: 1.05em; transform: rotate(-4deg); text-transform: none; margin-left: .3em; }
  .og p.sub { margin-top: 26px; font-size: 22px; color: var(--text-2); }
  .og .brand__name { font-size: 40px; }
  .stack { position: relative; height: 470px; }
  .stack img { position: absolute; width: 250px; border-radius: 4px; box-shadow: 0 30px 50px -20px #000; }
  .stack img:nth-child(1) { left: 0; top: 40px; transform: rotate(-4deg); }
  .stack img:nth-child(2) { left: 200px; top: 0; transform: rotate(4deg); }
  .stack img:nth-child(3) { left: 70px; top: 300px; transform: rotate(-1deg); }
</style></head>
<body class="og">
  <div>
    <span class="brand"><span class="brand__name">Maguila’s</span><span class="brand__sub">Restaurante &amp; Grill · Cascavel/PR</span></span>
    <h1>Buffet<br><span class="script">caprichado,</span><br>grelhado <span class="gold">na hora.</span></h1>
    <p class="sub">Buffet por quilo · café da manhã · marmitas · porções</p>
  </div>
  <div class="stack">
    <img src="../assets/images/foto-buffet-vitrine.webp" alt="">
    <img src="../assets/images/foto-sobremesa-copos.webp" alt="">
    <img src="../assets/images/foto-marmita.webp" alt="">
  </div>
</body></html>
